<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprit Animal | Find Your Inner Buddy</title>
    <meta name="description" content="Discover your cute spirit animal personality in 3 minutes!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Hero Section -->
    <section id="hero" class="screen active">
        <div class="glass-card hero-content">
            <h1>Find Your <br><span class="gradient-text">Spirit Animal</span></h1>
            <p>Ready to meet your inner cutie? Answer 5 fun questions to reveal your matching animal!</p>
            <button id="start-btn" class="cta-button">Start Quiz ✨</button>
        </div>
    </section>

    <!-- Quiz Section -->
    <section id="quiz" class="screen">
        <div class="glass-card quiz-content">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div id="question-container">
                <h2 id="question-text">Question goes here?</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options injected via JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- Result Section -->
    <section id="result" class="screen">
        <div class="glass-card result-content">
            <p class="pre-title">Your Spirit Animal Is</p>
            <div class="result-image-container">
                <img id="result-img" src="" alt="Spirit Animal" class="result-avatar">
            </div>
            <h2 id="result-title" class="gradient-text">The Panda</h2>
            <p id="result-description">You are chill, lovable, and always down for a snack.</p>

            <div class="share-container">
                <p class="share-label">Share the Quiz!</p>
                <div class="share-buttons">
                    <button class="share-btn copy-3d" onclick="copyLink()">Copy Link 🔗</button>
                    <button id="retake-btn" class="share-btn play-3d">Play Again ↺</button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
